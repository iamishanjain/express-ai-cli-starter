name: Publish

# Runs only when a maintainer publishes a GitHub Release. Pull requests and
# forks can never reach this workflow. The `npm` environment requires approval.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'iamishanjain/express-ai-cli-starter'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Release must come from master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Tag must match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:package

      - name: Publish
        run: npm publish --provenance --access public ${{ github.event.release.prerelease && '--tag next' || '' }}
